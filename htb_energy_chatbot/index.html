<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Dify チャットボット</title>
  <link rel="stylesheet" href="index.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
  <div id="chat-toggle" class="chat-bubble-container">
    <div class="chat-bubble">チャットでAIに質問</div>
    <div class="chat-icon">
      <img src="chatbot.png" alt="チャットアイコン" />
    </div>
  </div>

  <div id="chat-window">
    <div id="chat-header">
      HTB ENERGY AIチャットボット
      <div id="window-controls">
        <button id="reset-log">⟳</button>
        <button id="close-chat">×</button>
      </div>
    </div>

    <div class="resize-handle topleft"></div>
    <div class="resize-handle top"></div>
    <div class="resize-handle left"></div>

    <div id="chat-log"></div>

    <div id="chat-input">
      <textarea id="question" placeholder="質問を入力..." rows="1" style="flex:1; resize:none;"></textarea>
      <button onclick="send()">送信</button>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const toggleButton = document.getElementById("chat-toggle");
      const chatWindow = document.getElementById("chat-window");
      const input = document.getElementById("question");
      const chatLog = document.getElementById("chat-log");
      const closeButton = document.getElementById("close-chat");
      const resetButton = document.getElementById("reset-log");
      const isMobile = /iPhone|Android.+Mobile|Windows Phone/.test(navigator.userAgent);

      function renderInitialMessage() {
        chatLog.innerHTML = `
          <div class="message bot">
            <img src="bot-icon.png" class="avatar" alt="Bot">
            <div class="bubble">
              ご質問がございましたら、下記のよくあるご質問から選択いただくか、直接ご入力ください。<br>
              ※本チャットはAIによる自動応答サービスです。内容によっては正確にお答えできない場合や、誤ったご案内をすることがあります。あらかじめご了承くださいますようお願いいたします。
            </div>
          </div>
          <div id="suggestions">
            <button onclick="suggest('メールアドレス変更をしたい')">メールアドレス変更をしたい</button>
            <button onclick="suggest('解約手続きをしたい')">解約手続きをしたい</button>
            <button onclick="suggest('名義変更をしたい')">名義変更をしたい</button>
            <button onclick="suggest('電話番号変更をしたい')">電話番号変更をしたい</button>
            <button onclick="suggest('請求先変更をしたい')">請求先変更をしたい</button>
            <button onclick="suggest('アンペア変更をしたい')">アンペア変更をしたい</button>
            <button onclick="suggest('プラン変更をしたい')">プラン変更をしたい</button>
            <button onclick="suggest('引越しに伴う手続きをしたい')">引越しに伴う手続きをしたい</button>
          </div>`;
      }

      window.send = async function () {
        const message = input.value.trim();
        if (!message) return;

        chatLog.innerHTML += `<div class="message user"><div class="bubble">${message}</div></div>`;
        input.value = "";

        const typingId = `typing-${Date.now()}`;
        chatLog.innerHTML += `
          <div class="message bot" id="${typingId}">
            <img src="bot-icon.png" class="avatar" alt="Bot">
            <div class="bubble typing">......</div>
          </div>`;
        chatLog.scrollTop = chatLog.scrollHeight;

        try {
          const res = await fetch("https://ai-chatbot-rate-814681578419.asia-northeast1.run.app/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: message, user_id: "web-user" })
          });

          const data = await res.json();
          const answer = data.answer || "（回答が取得できませんでした）";
          const messageId = data.message_id;
          const conversationId = data.conversation_id || "";

          const htmlAnswer = answer
            .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
            .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color:#007BFF;">$1</a>')
            .replace(/\n/g, "<br>");

          const typingElem = document.getElementById(typingId);
          if (typingElem) {
            typingElem.innerHTML = `
              <img src="bot-icon.png" class="avatar" alt="Bot">
              <div class="message-body">
                <div class="bubble">${htmlAnswer}</div>
                <div class="message-actions">
                  <button class="action-btn" title="Good"
                    data-rating="positive"
                    data-message-id="${messageId}"
                    data-conversation-id="${conversationId}"
                    data-answer="${encodeURIComponent(answer)}"
                    data-query="${encodeURIComponent(message)}"
                    onclick="handleFeedbackClick(this)">👍</button>
                  <button class="action-btn" title="Bad"
                    data-rating="negative"
                    data-message-id="${messageId}"
                    data-conversation-id="${conversationId}"
                    data-answer="${encodeURIComponent(answer)}"
                    data-query="${encodeURIComponent(message)}"
                    onclick="handleFeedbackClick(this)">👎</button>
                </div>
              </div>`;
          }
        } catch (err) {
          console.error(err);
        }

        chatLog.scrollTop = chatLog.scrollHeight;
      };

      window.rateFeedback = async function (rating, messageId, conversationId, answer, query) {
        try {
          const res = await fetch("https://ai-chatbot-rate-814681578419.asia-northeast1.run.app/api/feedback", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message_id: messageId,
              conversation_id: conversationId,
              query: query,
              answer: answer,
              rating: rating
            })
          });

          if (res.ok) {
            alert(`「${rating === "positive" ? "👍 Good" : "👎 Bad"}」を送信しました`);
          } else {
            alert("フィードバック送信に失敗しました");
          }
        } catch (err) {
          console.error("フィードバック送信中にエラー:", err);
          alert("通信エラーが発生しました");
        }
      };

      window.handleFeedbackClick = (btn) => {
        const rating = btn.dataset.rating;
        const messageId = btn.dataset.messageId;
        const conversationId = btn.dataset.conversationId;
        const answer = decodeURIComponent(btn.dataset.answer);
        const query = decodeURIComponent(btn.dataset.query);

        rateFeedback(rating, messageId, conversationId, answer, query);
        console.log("送信データ:", { messageId, conversationId, query, answer, rating });
      };

      window.suggest = function (text) {
        input.value = text;
        send();
      };

      if (!isMobile) {
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            send();
          }
        });
      }

      toggleButton.addEventListener("click", () => {
        chatWindow.style.display = chatWindow.style.display === "flex" ? "none" : "flex";
      });

      closeButton.addEventListener("click", () => {
        chatWindow.style.display = "none";
      });

      resetButton.addEventListener("click", renderInitialMessage);

      function makeResizable(el) {
        const handles = {
          topleft: el.querySelector(".resize-handle.topleft"),
          top: el.querySelector(".resize-handle.top"),
          left: el.querySelector(".resize-handle.left")
        };

        function startDrag(handle, getSize, setSize) {
          handle.addEventListener("mousedown", (e) => {
            e.preventDefault();
            const startX = e.clientX;
            const startY = e.clientY;
            const startWidth = getSize(el, "width");
            const startHeight = getSize(el, "height");

            function drag(e) {
              const newWidth = Math.max(startWidth - (e.clientX - startX), 250);
              const newHeight = Math.max(startHeight - (e.clientY - startY), 200);
              setSize(el, newWidth, newHeight);
            }

            function stop() {
              window.removeEventListener("mousemove", drag);
              window.removeEventListener("mouseup", stop);
            }

            window.addEventListener("mousemove", drag);
            window.addEventListener("mouseup", stop);
          });
        }

        startDrag(handles.topleft,
          (el, dir) => parseInt(getComputedStyle(el)[dir]),
          (el, w, h) => { el.style.width = `${w}px`; el.style.height = `${h}px`; });

        startDrag(handles.top,
          (el, _) => parseInt(getComputedStyle(el).height),
          (el, _, h) => { el.style.height = `${h}px`; });

        startDrag(handles.left,
          (el, _) => parseInt(getComputedStyle(el).width),
          (el, w) => { el.style.width = `${w}px`; });
      }

      makeResizable(chatWindow);
      renderInitialMessage();
    });
  </script>
</body>
</html>
